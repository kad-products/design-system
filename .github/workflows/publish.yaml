name: Publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Publish Package
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.KAD_WORKFLOW_AUTOMATION }}
        run: |
          echo "Publish package to GitHub Packages"
